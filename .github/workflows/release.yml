name: release

# Two ways to cut a release:
#   * push a version tag (e.g. v0.1.0-alpha), or
#   * run this workflow manually (workflow_dispatch) with a version input.
# Either way: build the release exe, compile the Inno Setup installer, and
# publish a GitHub prerelease with the installer attached. On manual dispatch
# the tag is created by the release step at the built commit.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v, e.g. 0.1.0-alpha"
        required: true
        default: "0.1.0-alpha"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Build release exe
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: Resolve version and tag
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ github.event.inputs.version }}"
            $tag = "v$v"
            $target = "${{ github.sha }}"
          } else {
            $tag = "${{ github.ref_name }}"
            $v = $tag.TrimStart('v')
            $target = ""
          }
          "version=$v"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "target=$target" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "Resolved tag=$tag version=$v target=$target"

      - name: Fetch bundled ffmpeg.exe (editor trim/preview)
        shell: pwsh
        run: |
          # The clip editor shells out to ffmpeg for frame-accurate trim and
          # filmstrip thumbnails (it has its own HEVC decoder, so no Windows
          # HEVC extension is needed). Capture never touches it. We bundle a
          # single ffmpeg.exe next to the app.
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip"
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          $dst = "$env:RUNNER_TEMP\ffmpeg"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          $exe = Get-ChildItem -Path $dst -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe not found in downloaded archive" }
          Copy-Item $exe.FullName ".\ffmpeg.exe" -Force
          "Bundled ffmpeg: $($exe.FullName) -> .\ffmpeg.exe"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & "$iscc" "/DMyAppVersion=${{ steps.ver.outputs.version }}" "installer\lowresourcecapture.iss"

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = "installer\Output\LowResourceCapture-Setup-${{ steps.ver.outputs.version }}.exe"
          if (-not (Test-Path $installer)) { throw "installer not found: $installer" }
          $relArgs = @(
            "${{ steps.ver.outputs.tag }}",
            "$installer",
            "--title", "LowResourceCapture ${{ steps.ver.outputs.tag }}",
            "--notes-file", ".github/release-notes-alpha.md",
            "--prerelease"
          )
          if ("${{ steps.ver.outputs.target }}" -ne "") {
            $relArgs += @("--target", "${{ steps.ver.outputs.target }}")
          }
          gh release create @relArgs
