[package]
name = "lowresourcecapture"
version = "0.1.0"
edition = "2021"
description = "Low-overhead retroactive game clip recorder for Windows (NVENC/HEVC, ring-buffer instant replay)"
license = "MIT"
publish = false

[[bin]]
name = "lowresourcecapture"
path = "src/main.rs"

# Windowed subsystem so no console window pops up when launched from Explorer.
# (Release builds only; debug keeps the console for logs.)

[dependencies]
# Thin Win32 wrappers, no heavy runtime.
global-hotkey = "0.6"
tray-icon = "0.19"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
log = "0.4"
simple-logging = "2"
directories = "5"

# windows-rs: only the feature namespaces we actually touch, to keep the
# binary and compile surface small.
[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Audio",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Foundation",
    "Foundation_Metadata",
]

[profile.release]
opt-level = "z"     # optimize for size; capture/encode work is on the GPU, not hot Rust code
lto = true
codegen-units = 1
panic = "abort"
strip = true
