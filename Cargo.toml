[workspace]
resolver = "2"
members = ["crates/shared", "crates/recorder", "crates/analyzer"]

[workspace.package]
version = "0.1.22"
edition = "2021"
license = "MIT"
publish = false

# Shared dependency versions so the two apps can never drift apart.
# Verified against docs.rs on 2026-07-21 (primary source, per
# truth-maintenance — search summaries don't count for release state).
[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
directories = "5"
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.35"    # 0.35.3
toml = "0.8"
wry = "0.55"    # 0.55.1

[profile.release]
opt-level = "z"     # recorder is size-optimized; its work is on the GPU, not hot Rust code
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The analyzer is the opposite trade: it runs offline, never while gaming, and
# is CPU-bound on frame decode and pixel work. Size doesn't matter; speed does.
[profile.release.package.analyzer]
opt-level = 3
