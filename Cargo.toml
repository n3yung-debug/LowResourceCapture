[package]
name = "lowresourcecapture"
version = "0.1.13"
edition = "2021"
description = "Low-overhead retroactive game clip recorder for Windows (NVENC/HEVC, ring-buffer instant replay)"
license = "MIT"
publish = false

[[bin]]
name = "lowresourcecapture"
path = "src/main.rs"

# Windowed subsystem so no console window pops up when launched from Explorer.
# (Release builds only; debug keeps the console for logs.)

[dependencies]
# Thin Win32 wrappers, no heavy runtime.
# Versions verified against docs.rs on 2026-07-21 (primary source, per
# truth-maintenance v1.8 — search summaries don't count for release state).
global-hotkey = "0.8"   # 0.8.0, 2026-05-01
tray-icon = "0.24"      # 0.24.1, 2026-06-10
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"

# Settings GUI (WebView2). Only runs in the separate `--gui` process, so it
# adds nothing to the tray/capture footprint while gaming. Versions verified
# against docs.rs 2026-07-21.
wry = "0.55"    # 0.55.1
tao = "0.35"    # 0.35.3
log = { version = "0.4", features = ["std"] }  # set_boxed_logger needs `std`
directories = "5"

# windows-rs: only the feature namespaces we actually touch, to keep the
# binary and compile surface small.
[dependencies.windows]
version = "0.62"        # 0.62.2, 2025-10-06 (verified docs.rs 2026-07-21)
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",  # SetUnhandledExceptionFilter + EXCEPTION_POINTERS live here
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Audio",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Foundation",
    "Foundation_Metadata",
]

# Embeds the app icon into the exe (Windows only).
[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"     # optimize for size; capture/encode work is on the GPU, not hot Rust code
lto = true
codegen-units = 1
panic = "abort"
strip = true
