[package]
name = "analyzer"
description = "Offline VOD analyzer — finds kills and deaths in a recording so they can be edited on the clip timeline."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "clipanalyzer"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }

anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true

# Detection profiles are TOML on disk so adding a game is a config file, not a
# release.
toml.workspace = true

# Review UI reuses the same WebView2 stack as the clip editor.
tao.workspace = true
wry.workspace = true

# A windowed build has no console, so the file picker and error reporting have
# to be real windows. Only the two namespaces that needs.
[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_Controls_Dialogs",     # GetOpenFileNameW
    "Win32_UI_WindowsAndMessaging",  # MessageBoxW
]

[build-dependencies]
winresource = "0.1"
