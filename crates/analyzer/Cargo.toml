[package]
name = "analyzer"
description = "Offline VOD analyzer — finds kills and deaths in a recording so they can be edited on the clip timeline."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "clipanalyzer"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }

anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true

# Detection profiles are TOML on disk so adding a game is a config file, not a
# release.
toml.workspace = true

# Review UI reuses the same WebView2 stack as the clip editor.
tao.workspace = true
wry.workspace = true

[build-dependencies]
winresource = "0.1"
