<meta charset="utf-8">
<title>Review detections</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --line: #2c313a; --text: #e6e8ec;
    --dim: #939aa6; --ok: #4ea36b; --no: #b8503f; --pend: #b08a3c; --accent: #4a7fb5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; background: var(--bg);
         color: var(--text); font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }

  #side { width: 300px; flex: none; border-right: 1px solid var(--line);
          display: flex; flex-direction: column; }
  #head { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  #head h1 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
  #tally { color: var(--dim); font-size: 12px; }
  #scan { color: var(--accent); font-size: 12px; margin-top: 3px; }
  #scan.done { color: var(--dim); }
  #scan.failed { color: var(--no); }
  #list { flex: 1; overflow-y: auto; }
  .ev { padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer;
        display: flex; gap: 8px; align-items: baseline; }
  .ev:hover { background: #21252c; }
  .ev.sel { background: #263041; box-shadow: inset 3px 0 0 var(--accent); }
  .ev .t { font-variant-numeric: tabular-nums; color: var(--dim); }
  .ev .k { flex: 1; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.p { background: var(--pend); } .dot.y { background: var(--ok); }
  .dot.n { background: var(--no); }
  .man { font-size: 10px; color: var(--accent); border: 1px solid var(--accent);
         border-radius: 3px; padding: 0 3px; }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center;
           background: #000; min-height: 0; position: relative; }
  video { max-width: 100%; max-height: 100%; }
  #msg { position: absolute; color: var(--dim); }
  #bar { padding: 10px 12px; border-top: 1px solid var(--line); background: var(--panel); }
  #where { color: var(--dim); margin-bottom: 8px; font-variant-numeric: tabular-nums; }
  button { background: #262b33; color: var(--text); border: 1px solid var(--line);
           border-radius: 4px; padding: 6px 12px; cursor: pointer; font: inherit; }
  button:hover { background: #2f353f; }
  button.y { border-color: var(--ok); } button.n { border-color: var(--no); }
  kbd { background: #10131a; border: 1px solid var(--line); border-radius: 3px;
        padding: 0 4px; font-size: 11px; color: var(--dim); }
  #keys { margin-top: 8px; color: var(--dim); font-size: 12px; }

  /* Training panel */
  #train { position: fixed; inset: 0; background: rgba(10,12,15,.88); display: none;
           align-items: center; justify-content: center; z-index: 50; }
  #train.on { display: flex; }
  #tbox { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
          width: min(880px, 92vw); max-height: 88vh; display: flex; flex-direction: column; }
  #thead { padding: 12px 16px; border-bottom: 1px solid var(--line);
           display: flex; align-items: center; gap: 12px; }
  #thead h2 { margin: 0; font-size: 14px; flex: 1; }
  #tbody { padding: 14px 16px; overflow-y: auto; }
  .row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .stat { background: #22262e; border: 1px solid var(--line); border-radius: 4px;
          padding: 6px 10px; font-variant-numeric: tabular-nums; }
  .stat b { color: var(--accent); }
  .warn { color: var(--pend); }
  .bad { color: var(--no); }
  .good { color: var(--ok); }
  #tlog { background: #0d1015; border: 1px solid var(--line); border-radius: 4px;
          font: 11px/1.5 Consolas, monospace; padding: 8px; height: 260px;
          overflow-y: auto; white-space: pre-wrap; color: #c3c9d4; }
  #tlog:empty::before { content: "Output appears here."; color: var(--dim); }
  input[type=text] { background: #10131a; border: 1px solid var(--line); color: var(--text);
                     border-radius: 4px; padding: 6px 8px; font: inherit; flex: 1; min-width: 220px; }
  .hint { color: var(--dim); font-size: 12px; margin: 2px 0 10px; }
</style>

<div id="side">
  <div id="head">
    <h1 id="vid">—</h1>
    <div id="tally">loading…</div>
    <div id="scan">scanning for deaths…</div>
  </div>
  <div id="list"></div>
</div>

<div id="main">
  <div id="stage"><video id="v" playsinline controls></video><div id="msg"></div></div>
  <div id="bar">
    <div id="where">—</div>
    <button class="y" onclick="verdict(true)">✓ Confirm <kbd>Y</kbd></button>
    <button class="n" onclick="verdict(false)">✕ Reject <kbd>N</kbd></button>
    <button onclick="mark('playerkill')">+ Kill here <kbd>K</kbd></button>
    <button onclick="mark('death')">+ Death here <kbd>D</kbd></button>
    <button onclick="mark('monsterkill')">+ Monster here <kbd>M</kbd></button>
    <button onclick="exportClips()">Export confirmed → clip</button>
    <button onclick="openTraining()">🧠 Training…</button>
    <div id="keys">
      <kbd>←</kbd><kbd>→</kbd> prev/next detection · <kbd>Space</kbd> play/pause ·
      scrub the video freely — marks land at the playhead
    </div>
  </div>
</div>

<div id="train">
  <div id="tbox">
    <div id="thead">
      <h2>Training</h2>
      <button onclick="closeTraining()">Close</button>
    </div>
    <div id="tbody">
      <div class="row"><b>1. Dataset</b></div>
      <div class="hint">Confirmed marks from this recording become training frames.
        Press <kbd>Y</kbd>/<kbd>K</kbd>/<kbd>M</kbd>/<kbd>D</kbd> in the review window first.</div>
      <div class="row">
        <input type="text" id="tdir" placeholder="dataset folder">
        <input type="text" id="tbuild" placeholder="game build, e.g. 2026.08.06" style="max-width:220px">
      </div>
      <div class="row" id="tstats"></div>
      <div class="row">
        <button onclick="doExport()">Add this recording to the dataset</button>
      </div>

      <div class="row" style="margin-top:16px"><b>2. Python</b></div>
      <div class="row" id="tpy"><span class="dim">checking…</span></div>
      <div class="row">
        <button onclick="doInstall()" id="tinstall" style="display:none">Install dependencies</button>
      </div>

      <div class="row" style="margin-top:16px"><b>3. Train</b></div>
      <div class="row">
        <button onclick="doTrain()" id="ttrain">Train model</button>
        <button onclick="doCancel()" id="tcancel" style="display:none">Cancel</button>
      </div>
      <div id="tlog"></div>
    </div>
  </div>
</div>

<script>
  const send = m => window.ipc.postMessage(JSON.stringify(m));
  const v = document.getElementById("v");
  let data = { labels: [], video: "", url: "", duration: 0, pre: 12, post: 4 };
  let sel = -1;

  window.reviewData = d => {
    data = d;
    document.getElementById("vid").textContent = d.video.split(/[\\/]/).pop();
    // The whole video is served with range support, so it loads once and seeks
    // natively. That matters most when the scan found NOTHING — you still get
    // a scrubbable video to mark kills on, which is the usual case.
    if (v.src !== d.url) v.src = d.url;
    if (d.scan) scanEl().textContent = d.scan;
    render();
    if (d.labels.length) {
      // Open on the first thing still awaiting a verdict — that's the queue.
      const i = d.labels.findIndex(l => l.confirmed === null);
      select(i >= 0 ? i : 0);
    } else {
      msg("Nothing detected — scrub to a kill and press K to mark it.");
      document.getElementById("where").textContent =
        "No detections. Scrub freely; K and D mark at the playhead.";
    }
  };

  function msg(t) { document.getElementById("msg").textContent = t || ""; }

  function render() {
    const c = { y: 0, n: 0, p: 0 };
    data.labels.forEach(l => c[l.confirmed === true ? "y" : l.confirmed === false ? "n" : "p"]++);
    document.getElementById("tally").textContent =
      `${c.y} confirmed · ${c.n} rejected · ${c.p} pending`;
    document.getElementById("list").innerHTML = data.labels.map((l, i) => {
      const s = l.confirmed === true ? "y" : l.confirmed === false ? "n" : "p";
      return `<div class="ev ${i === sel ? "sel" : ""}" onclick="select(${i})">
        <span class="dot ${s}"></span>
        <span class="t">${fmt(l.at)}</span>
        <span class="k">${kindName(l.kind)}</span>
        ${l.origin === "manual" ? '<span class="man">manual</span>' : ""}
      </div>`;
    }).join("");
  }

  const kindName = k =>
    k === "playerkill" ? "Player kill" : k === "monsterkill" ? "Monster kill" : "Death";

  function fmt(s) {
    const m = Math.floor(s / 60), r = Math.floor(s % 60);
    return `${m}:${String(r).padStart(2, "0")}`;
  }

  function select(i) {
    if (i < 0 || i >= data.labels.length) return;
    sel = i; render();
    const l = data.labels[i];
    document.getElementById("where").textContent =
      `${kindName(l.kind)} at ${fmt(l.at)}`;
    // Start a few seconds early so the event has context, then play.
    msg("");
    v.currentTime = Math.max(0, l.at - 5);
    v.play().catch(() => {});
  }

  window.clipError = m => msg(m);

  const scanEl = () => document.getElementById("scan");
  window.scanProgress = f => {
    scanEl().textContent = `scanning for deaths… ${Math.round(f * 100)}%`;
  };
  window.scanDone = n => {
    const el = scanEl();
    el.className = "done";
    el.textContent = n
      ? `scan complete — ${n} death${n === 1 ? "" : "s"} found`
      : "scan complete — no deaths found. Scrub and press K to mark kills.";
    // Land on the first unreviewed detection if the scan turned any up.
    if (n && sel < 0) {
      const i = data.labels.findIndex(l => l.confirmed === null);
      if (i >= 0) select(i);
    }
  };
  window.scanFailed = m => {
    const el = scanEl();
    el.className = "failed";
    el.textContent = `scan failed — ${m}`;
  };
  v.addEventListener("error", () => msg(
    "Could not play this video. If it's HEVC, WebView2 may not decode it — " +
    "H.264 sources (Twitch VODs, OBS defaults) work."));

  // The label list is rebuilt from Rust after every change, so the UI can never
  // drift from what's actually on disk.
  window.updated = d => { data = d; render(); };

  function verdict(ok) {
    if (sel < 0) return;
    send({ cmd: "verdict", index: sel, ok });
    const next = data.labels.findIndex((l, i) => i > sel && l.confirmed === null);
    if (next >= 0) setTimeout(() => select(next), 120);
  }

  function mark(kind) {
    // The video IS the source, so the playhead is already source time — no
    // window offset to get wrong.
    send({ cmd: "mark", kind, at: v.currentTime || 0 });
  }

  function exportClips() { send({ cmd: "export" }); }

  // ---- Training panel ----
  let busy = false;

  function openTraining() {
    document.getElementById("train").classList.add("on");
    send({ cmd: "trainingStatus" });
  }
  function closeTraining() {
    document.getElementById("train").classList.remove("on");
  }

  window.trainingStatus = s => {
    if (!document.getElementById("tdir").value) {
      document.getElementById("tdir").value = s.dataset.dir;
    }
    if (s.build && !document.getElementById("tbuild").value) {
      document.getElementById("tbuild").value = s.build;
    }

    const d = s.dataset;
    const parts = [];
    if (!d.exists) {
      parts.push('<span class="stat warn">empty — add a recording</span>');
    } else {
      parts.push(`<span class="stat"><b>${d.total}</b> frames</span>`);
      parts.push(`<span class="stat"><b>${d.sources}</b> recordings</span>`);
      for (const [k, v] of Object.entries(d.per_class)) {
        const thin = v < 50 ? " warn" : "";
        parts.push(`<span class="stat${thin}">${k}: <b>${v}</b></span>`);
      }
      if (d.builds.length) parts.push(`<span class="stat">builds: ${d.builds.join(", ")}</span>`);
      if (!d.enough_to_train) {
        parts.push('<span class="stat warn">needs ≥2 recordings before a score means anything</span>');
      }
    }
    document.getElementById("tstats").innerHTML = parts.join(" ");

    const py = s.python;
    const el = document.getElementById("tpy");
    if (!py.command) {
      el.innerHTML = `<span class="bad">${py.detail}</span>`;
      document.getElementById("tinstall").style.display = "none";
    } else if (!py.deps_ok) {
      el.innerHTML = `<span class="warn">${py.version} — ${py.detail}</span>`;
      document.getElementById("tinstall").style.display = "";
    } else {
      el.innerHTML = `<span class="good">${py.version} — ready</span>`;
      document.getElementById("tinstall").style.display = "none";
    }

    if (s.model) {
      log(s.model);
    }
  };

  function log(line) {
    const el = document.getElementById("tlog");
    el.textContent += line + "\n";
    el.scrollTop = el.scrollHeight;
  }
  window.trainLog = log;

  window.trainBusy = on => {
    busy = on;
    document.getElementById("ttrain").disabled = on;
    document.getElementById("tinstall").disabled = on;
    document.getElementById("tcancel").style.display = on ? "" : "none";
  };

  function doExport() {
    if (busy) return;
    send({
      cmd: "exportDataset",
      dir: document.getElementById("tdir").value,
      build: document.getElementById("tbuild").value,
    });
  }
  function doInstall() {
    if (busy) return;
    log("Installing torch/torchvision/pillow — this is a large download, several minutes.");
    send({ cmd: "installDeps" });
  }
  function doTrain() {
    if (busy) return;
    send({
      cmd: "trainModel",
      dir: document.getElementById("tdir").value,
      build: document.getElementById("tbuild").value,
    });
  }
  function doCancel() { send({ cmd: "cancelTraining" }); }

  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    const k = e.key.toLowerCase();
    if (k === "y") verdict(true);
    else if (k === "n") verdict(false);
    else if (k === "k") mark("playerkill");
    else if (k === "d") mark("death");
    else if (k === "m") mark("monsterkill");
    else if (e.key === "ArrowLeft") select(sel - 1);
    else if (e.key === "ArrowRight") select(sel + 1);
    else if (e.key === " ") { e.preventDefault(); v.paused ? v.play() : v.pause(); }
    else return;
    e.preventDefault();
  });

  send({ cmd: "load" });
</script>
