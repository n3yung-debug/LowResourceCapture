[package]
name = "shared"
description = "Config, logging, ffmpeg wrappers and the clip editor, shared by the recorder and the analyzer."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
directories.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# The block-timeline clip editor is a WebView2 window. It lives here rather
# than in the recorder so the analyzer can open the same editor on a VOD
# instead of forking a second copy of it.
tao.workspace = true
wry.workspace = true

# Only the namespaces `logging.rs` actually touches — the crash handler and
# thread id. Everything Win32-heavy stays in the recorder.
[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Threading",
]
