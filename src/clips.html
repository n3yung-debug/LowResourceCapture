<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LowResourceCapture — Clips</title>
<style>
  :root {
    --bg:#16181d; --panel:#1e2128; --panel2:#262a33; --border:#333846;
    --text:#e6e8ec; --muted:#9aa0ac; --accent:#e02b2b; --accent2:#ff5a5a;
    --ok:#2ecc71; --field:#12141a;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--text); font:14px/1.45 "Segoe UI",system-ui,sans-serif;
    display:flex; flex-direction:column; }
  header { padding:14px 20px 10px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; gap:12px; }
  header h1 { margin:0; font-size:16px; font-weight:600; }
  header .count { color:var(--muted); font-size:12px; }
  .tbar-btn { cursor:pointer; background:var(--panel2); color:var(--text);
    border:1px solid var(--border); border-radius:7px; padding:7px 12px; font:inherit; }
  .tbar-btn:hover { border-color:var(--accent2); }
  main { flex:1; overflow-y:auto; padding:12px 16px; }
  .clip { display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center;
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; margin-bottom:8px; }
  .badge { font-size:11px; color:#fff; background:var(--panel2); border:1px solid var(--border);
    padding:4px 8px; border-radius:999px; white-space:nowrap; max-width:130px; overflow:hidden;
    text-overflow:ellipsis; }
  .meta .name { font-weight:600; word-break:break-all; }
  .meta .sub { color:var(--muted); font-size:12px; margin-top:2px; }
  .actions { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .act { cursor:pointer; background:var(--field); color:var(--text); border:1px solid var(--border);
    border-radius:7px; padding:6px 10px; font:inherit; font-size:12px; }
  .act:hover { border-color:var(--accent2); }
  .act.play { background:var(--accent); border-color:var(--accent); font-weight:600; }
  .act.play:hover { background:var(--accent2); }
  .act.trim { background:var(--panel2); }
  .act.del:hover { border-color:var(--accent2); color:var(--accent2); }
  .empty { color:var(--muted); text-align:center; padding:60px 20px; }
  footer { padding:10px 20px; border-top:1px solid var(--border); color:var(--muted); font-size:11px; }

  /* ---- Trim editor overlay ---- */
  #trim { position:fixed; inset:0; background:rgba(10,11,14,0.86); display:none;
    align-items:center; justify-content:center; padding:24px; z-index:10; }
  #trim.on { display:flex; }
  .trim-card { background:var(--panel); border:1px solid var(--border); border-radius:14px;
    width:min(760px,100%); max-height:100%; overflow:auto; padding:18px 20px; }
  .trim-card h2 { margin:0 0 2px; font-size:15px; font-weight:600; }
  .trim-card .fn { color:var(--muted); font-size:12px; word-break:break-all; margin-bottom:16px; }
  /* Timeline */
  .tl-wrap { user-select:none; }
  .tl { position:relative; height:74px; border:1px solid var(--border); border-radius:8px;
    background:var(--field) center/cover no-repeat; overflow:hidden; touch-action:none; }
  .tl .shade { position:absolute; top:0; bottom:0; background:rgba(10,11,14,0.68); pointer-events:none; }
  .tl .sel { position:absolute; top:0; bottom:0; border-left:3px solid var(--accent2);
    border-right:3px solid var(--accent2); box-shadow:inset 0 0 0 1px rgba(255,90,90,0.4);
    pointer-events:none; }
  .tl .handle { position:absolute; top:0; bottom:0; width:16px; margin-left:-8px; cursor:ew-resize;
    display:flex; align-items:center; justify-content:center; }
  .tl .handle::after { content:""; width:4px; height:60%; background:var(--accent2); border-radius:2px;
    box-shadow:0 0 0 2px rgba(10,11,14,0.55); }
  .tl.loading { display:flex; align-items:center; justify-content:center; color:var(--muted); }
  .tl-times { display:flex; justify-content:space-between; color:var(--muted); font-size:12px;
    margin-top:8px; font-variant-numeric:tabular-nums; }
  .tl-times b { color:var(--text); font-weight:600; }
  .trim-foot { display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin-top:18px; }
  .trim-foot .status { color:var(--muted); font-size:12px; min-height:16px; }
  .trim-foot .status.err { color:var(--accent2); }
  .trim-foot .status.ok { color:var(--ok); }
  .trim-foot .btns { display:flex; gap:8px; }
  .btn { cursor:pointer; font:inherit; border-radius:8px; padding:9px 16px; border:1px solid var(--border);
    background:var(--field); color:var(--text); }
  .btn:hover { border-color:var(--accent2); }
  .btn.primary { background:var(--accent); border-color:var(--accent); font-weight:600; }
  .btn.primary:hover { background:var(--accent2); }
  .btn:disabled { opacity:0.5; cursor:default; border-color:var(--border); }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Clips</h1>
      <div class="count" id="count"></div>
    </div>
    <button class="tbar-btn" id="openFolder">Open clips folder</button>
  </header>
  <main id="list"></main>
  <footer id="foot">Clips play in your default player. Delete removes the file from disk.</footer>

  <!-- Trim editor -->
  <div id="trim">
    <div class="trim-card">
      <h2>Trim clip</h2>
      <div class="fn" id="trimName"></div>
      <div class="tl-wrap">
        <div class="tl loading" id="tl">Loading timeline…</div>
        <div class="tl-times">
          <span>In <b id="tIn">0:00.0</b></span>
          <span>Length <b id="tLen">0:00.0</b></span>
          <span>Out <b id="tOut">0:00.0</b></span>
        </div>
      </div>
      <div class="trim-foot">
        <div class="status" id="trimStatus"></div>
        <div class="btns">
          <button class="btn" id="trimCancel">Cancel</button>
          <button class="btn primary" id="trimSave">Save trimmed copy</button>
        </div>
      </div>
    </div>
  </div>

<script>
  const clips = (window.__CLIPS__ || []).slice();
  const HAS_FFMPEG = !!window.__FFMPEG__;
  const listEl = document.getElementById('list');
  document.getElementById('count').textContent =
    clips.length ? `${clips.length} clip${clips.length === 1 ? '' : 's'}` : '';
  if (!HAS_FFMPEG) {
    document.getElementById('foot').textContent =
      'Clips play in your default player. (Trim is unavailable — ffmpeg.exe was not found next to the app.)';
  }

  function send(obj) {
    if (window.ipc && window.ipc.postMessage) window.ipc.postMessage(JSON.stringify(obj));
  }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
  function fmtDate(secs){ return secs ? new Date(secs*1000).toLocaleString() : ''; }
  function dirOf(p){ const i = Math.max(p.lastIndexOf('\\'), p.lastIndexOf('/')); return i>=0 ? p.slice(0,i) : ''; }
  function fmtTime(s){
    s = Math.max(0, s);
    const m = Math.floor(s/60), sec = s - m*60;
    return `${m}:${sec.toFixed(1).padStart(4,'0')}`;
  }

  function render() {
    if (!clips.length) { listEl.innerHTML = '<div class="empty">No clips yet. Press a clip hotkey while capturing, then reopen this window.</div>'; return; }
    listEl.innerHTML = '';
    clips.forEach((c, i) => {
      const row = document.createElement('div');
      row.className = 'clip';
      row.innerHTML = `
        <div class="badge" title="${esc(c.folder)}">${esc(c.folder || '—')}</div>
        <div class="meta">
          <div class="name">${esc(c.name)}</div>
          <div class="sub">${c.seconds ? c.seconds + 's · ' : ''}${(c.size_mb||0).toFixed(1)} MB · ${esc(fmtDate(c.modified))}</div>
        </div>
        <div class="actions">
          <button class="act play">Play</button>
          ${HAS_FFMPEG ? '<button class="act trim">Trim</button>' : ''}
          <button class="act reveal">Reveal</button>
          <button class="act rename">Rename</button>
          <button class="act del">Delete</button>
        </div>`;
      row.querySelector('.play').onclick = () => send({ cmd:'play', path:c.path });
      row.querySelector('.reveal').onclick = () => send({ cmd:'reveal', path:c.path });
      if (HAS_FFMPEG) row.querySelector('.trim').onclick = () => openTrim(c);
      row.querySelector('.del').onclick = () => {
        if (confirm(`Delete "${c.name}"? This removes the file from disk.`)) {
          send({ cmd:'delete', path:c.path });
          clips.splice(clips.indexOf(c), 1);
          render();
          document.getElementById('count').textContent = clips.length ? `${clips.length} clip${clips.length===1?'':'s'}` : '';
        }
      };
      row.querySelector('.rename').onclick = () => {
        const base = c.name.replace(/\.mp4$/i, '');
        const next = prompt('New name (without .mp4):', base);
        if (next && next.trim() && next.trim() !== base) {
          const clean = next.trim().replace(/[\\/:*?"<>|]/g, '_');
          const newName = clean + '.mp4';
          const newPath = dirOf(c.path) + '\\' + newName;
          send({ cmd:'rename', path:c.path, new_path:newPath });
          c.path = newPath; c.name = newName;
          render();
        }
      };
      listEl.appendChild(row);
    });
  }

  /* ---------- Trim editor ---------- */
  const trimEl = document.getElementById('trim');
  const tl = document.getElementById('tl');
  const selEl = document.createElement('div'); selEl.className = 'sel';
  const shadeL = document.createElement('div'); shadeL.className = 'shade';
  const shadeR = document.createElement('div'); shadeR.className = 'shade';
  const hIn = document.createElement('div'); hIn.className = 'handle in';
  const hOut = document.createElement('div'); hOut.className = 'handle out';
  const statusEl = document.getElementById('trimStatus');
  const saveBtn = document.getElementById('trimSave');
  const cancelBtn = document.getElementById('trimCancel');

  let T = { clip:null, dur:0, inS:0, outS:0, ready:false, saving:false };

  function openTrim(c) {
    T = { clip:c, dur:0, inS:0, outS:0, ready:false, saving:false };
    document.getElementById('trimName').textContent = c.name;
    tl.className = 'tl loading';
    tl.style.backgroundImage = 'none';
    tl.textContent = 'Loading timeline…';
    setStatus('', '');
    saveBtn.disabled = true;
    trimEl.classList.add('on');
    send({ cmd:'trimOpen', path:c.path });
  }
  function closeTrim() { trimEl.classList.remove('on'); T.clip = null; }

  function setStatus(msg, kind) {
    statusEl.textContent = msg || '';
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  // Called from Rust once ffmpeg has read the duration + filmstrip.
  window.trimReady = function(info) {
    if (!T.clip) return;
    T.dur = info.duration || 0;
    T.inS = 0;
    T.outS = T.dur;
    T.ready = true;
    tl.className = 'tl';
    tl.textContent = '';
    if (info.strip) tl.style.backgroundImage = `url("${info.strip}")`;
    tl.appendChild(shadeL); tl.appendChild(shadeR);
    tl.appendChild(selEl); tl.appendChild(hIn); tl.appendChild(hOut);
    saveBtn.disabled = false;
    layout();
  };
  window.trimError = function(msg) {
    tl.className = 'tl loading';
    tl.textContent = msg || 'Could not read this clip.';
    setStatus(msg || 'Could not read this clip.', 'err');
  };
  window.trimDone = function(ok, detail) {
    T.saving = false;
    saveBtn.disabled = false;
    cancelBtn.disabled = false;
    if (ok) {
      setStatus(`Saved ${detail}`, 'ok');
      saveBtn.textContent = 'Save trimmed copy';
      setTimeout(closeTrim, 900);
    } else {
      setStatus('Trim failed: ' + detail, 'err');
      saveBtn.textContent = 'Save trimmed copy';
    }
  };

  function layout() {
    if (!T.ready || T.dur <= 0) return;
    const w = tl.clientWidth;
    const xi = (T.inS / T.dur) * w;
    const xo = (T.outS / T.dur) * w;
    shadeL.style.left = '0'; shadeL.style.width = xi + 'px';
    shadeR.style.left = xo + 'px'; shadeR.style.width = (w - xo) + 'px';
    selEl.style.left = xi + 'px'; selEl.style.width = (xo - xi) + 'px';
    hIn.style.left = xi + 'px';
    hOut.style.left = xo + 'px';
    document.getElementById('tIn').textContent = fmtTime(T.inS);
    document.getElementById('tOut').textContent = fmtTime(T.outS);
    document.getElementById('tLen').textContent = fmtTime(Math.max(0, T.outS - T.inS));
  }
  window.addEventListener('resize', layout);

  // Dragging the in/out handles.
  let drag = null; // 'in' | 'out'
  function xToTime(clientX) {
    const r = tl.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
    return frac * T.dur;
  }
  function onMove(e) {
    if (!drag || !T.ready) return;
    const t = xToTime(e.clientX);
    const MIN = 0.1; // keep at least 0.1s selected
    if (drag === 'in') T.inS = Math.min(t, T.outS - MIN);
    else T.outS = Math.max(t, T.inS + MIN);
    T.inS = Math.max(0, T.inS);
    T.outS = Math.min(T.dur, T.outS);
    layout();
  }
  function endDrag() {
    if (!drag) return;
    drag = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', endDrag);
  }
  function startDrag(which) {
    return (e) => {
      if (!T.ready) return;
      drag = which;
      e.preventDefault();
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', endDrag);
    };
  }
  hIn.addEventListener('pointerdown', startDrag('in'));
  hOut.addEventListener('pointerdown', startDrag('out'));
  // Click on the strip moves the nearest handle there.
  tl.addEventListener('pointerdown', (e) => {
    if (!T.ready || e.target === hIn || e.target === hOut) return;
    const t = xToTime(e.clientX);
    const which = Math.abs(t - T.inS) <= Math.abs(t - T.outS) ? 'in' : 'out';
    startDrag(which)(e);
    onMove(e);
  });

  cancelBtn.onclick = () => { if (!T.saving) closeTrim(); };
  saveBtn.onclick = () => {
    if (!T.ready || T.saving) return;
    if (T.outS - T.inS < 0.1) { setStatus('Selection is too short.', 'err'); return; }
    T.saving = true;
    saveBtn.disabled = true;
    cancelBtn.disabled = true;
    saveBtn.textContent = 'Saving…';
    setStatus('Encoding trimmed copy…', '');
    send({ cmd:'trimSave', path:T.clip.path, start:T.inS, end:T.outS });
  };
  // Esc closes the editor when not mid-save.
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && trimEl.classList.contains('on') && !T.saving) closeTrim();
  });

  document.getElementById('openFolder').onclick = () => send({ cmd:'openFolder' });
  render();
</script>
</body>
</html>
